<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Connexion — Administration DIOREA</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>

  <main class="login">
    <section class="login__card">
      <div class="login__brand">
        <span class="logo__name">DIOREA</span>
        <span class="logo__sub">GROUP · ADMINISTRATION</span>
      </div>

      <h1>Espace administrateur</h1>
      <p class="login__lead">Connectez-vous pour gérer la boutique.</p>

      <form id="loginForm" novalidate>
        <div class="field">
          <label for="email">Adresse e-mail</label>
          <input type="email" id="email" autocomplete="username" required>
        </div>
        <div class="field">
          <label for="password">Mot de passe</label>
          <input type="password" id="password" autocomplete="current-password" required>
        </div>

        <p class="login__error" id="loginError" role="alert"></p>

        <button type="submit" class="btn btn--gradient btn--block" id="loginBtn">Se connecter</button>
      </form>

      <div class="login__links">
        <a href="../index.html">← Retour au site</a>
        <a href="index.html">Continuer en mode démonstration (sans serveur)</a>
      </div>
    </section>
  </main>

  <script src="js/login.js"></script>
</body>
</html>
